version: '3.8'

x-app-image: &app-image
  image: malicious-url-detection:latest
  build: .

services:
  api:
    <<: *app-image
    container_name: url-detector-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    command: >
      uvicorn src.api.serve:app
      --host 0.0.0.0
      --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - url-detector-net
    restart: unless-stopped

  gui:
    <<: *app-image
    container_name: url-detector-gui
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000
    command: >
      streamlit run src/inference/gui.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
      --browser.gatherUsageStats=false
    networks:
      - url-detector-net
    restart: unless-stopped

networks:
  url-detector-net:
    driver: bridge